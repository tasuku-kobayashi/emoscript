name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache

jobs:
  test:
    # Model-free: lint, unit tests (fake embedder), corpus integrity. Fast.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests experiments
      - run: ruff format --check src tests experiments
      - run: pytest
      - run: emoscript corpus-check

  web:
    # The browser edition: the JavaScript port must agree with the Python source.
    # Model-free tests always; the end-to-end parity test (downloads the small
    # embedding model from the Hugging Face hub) on PRs, main and manual runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: web
      - name: Cache the browser embedding model
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: web/.hfcache
          key: transformersjs-${{ hashFiles('web/model.json') }}
      - name: End-to-end parity with the Python scorer (transformers.js, fp32)
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        working-directory: web
        env:
          EMOSCRIPT_HF_CACHE: .hfcache
        run: |
          npm install --no-audit --no-fund
          npm run parity

  evaluate:
    # Real embeddings: fits on the train splits, reports held-out metrics,
    # publishes the report and the fitted axes as workflow artifacts.
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-multilingual-e5-large-${{ runner.os }}
      - run: python -m pip install -e ".[dev,embed]"
      - name: Held-out validation, original casing (M1 / M2 / M3 / kNN / multi-axis k=2,3)
        run: python experiments/validate_axis.py --k 1,2,3 --json validation-none.json | tee validation-none.txt
      - name: Held-out validation, canonical (the shipped default)
        run: python experiments/validate_axis.py --k 1,2,3 --casing canonical --json validation-canonical.json | tee validation-canonical.txt
      - name: Fit shippable axes
        run: |
          emoscript fit --k 1 --out axis-k1.npz
          emoscript fit --k 2 --out axis-k2.npz
          emoscript eval --axis axis-k1.npz | tee -a eval.txt
          emoscript eval --axis axis-k2.npz | tee -a eval.txt
      - name: Summary
        run: |
          {
            echo '## emoscript held-out evaluation'
            python experiments/report.py validation-none.json validation-canonical.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ github.sha }}
          path: |
            validation-*.json
            validation-*.txt
            eval.txt
            axis-k1.npz
            axis-k2.npz
          retention-days: 30
