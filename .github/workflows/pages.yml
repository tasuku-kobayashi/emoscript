name: pages

# Publishes web/ (the browser edition) to GitHub Pages. configure-pages enables
# Pages (source: GitHub Actions) on the first run, so no manual setup is needed.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Model-free checks of the JavaScript port against the Python fixture
        working-directory: web
        run: npm test
      - name: Stage the static site (no tests, no node_modules)
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/worker.js web/emoscript.js web/styles.css web/model.json _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
