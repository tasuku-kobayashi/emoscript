[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emoscript"
version = "0.1.0"
description = "Find the direction of great ad copy: a semantic-axis scorer for taglines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "emoscript contributors" }]
keywords = ["embeddings", "semantic-axis", "copywriting", "taglines", "slogans"]
dependencies = ["numpy>=1.24", "fastembed>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
emoscript = "emoscript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emoscript = ["data/*.jsonl"]
